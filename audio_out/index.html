<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio por WebSocket</title>
</head>
<body>
  <h1>Audio por WebSocket</h1>
  <button id="connect-button">Conectar y recibir audio</button>
  <p id="status">Desconectado</p>
  <audio id="audio-output" autoplay controls></audio>

  <script>
    const connectButton = document.querySelector('#connect-button');
    const status = document.querySelector('#status');
    const audioOutput = document.querySelector('#audio-output');
    const SAMPLE_RATE = 48000; // debe coincidir con lo que manda el servidor

    connectButton.addEventListener('click', async () => {
      connectButton.disabled = true;
      status.textContent = 'Conectando...';

      // AudioContext debe crearse tras un gesto del usuario (el clic).
      const audioCtxt = new AudioContext({ sampleRate: SAMPLE_RATE });
      await audioCtxt.audioWorklet.addModule('/pcm-player-worklet.js');

      const player = new AudioWorkletNode(audioCtxt, 'pcm-player', {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [1],
      });
      const mediaStreamDestination = audioCtxt.createMediaStreamDestination();
      player.connect(mediaStreamDestination);
      audioOutput.srcObject = mediaStreamDestination.stream;
      await audioOutput.play();

      const socket = new WebSocket(`ws://${location.host}/ws`);
      socket.binaryType = 'arraybuffer';

      socket.addEventListener('open', () => {
        status.textContent = 'Recibiendo audio.';
      });

      socket.addEventListener('message', (event) => {
        // Cada mensaje es un frame PCM de 16 bits; lo pasamos a Float32
        // (rango -1..1), que es lo que espera Web Audio, y se lo mandamos
        // al worklet.
        const int16 = new Int16Array(event.data);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 32768;
        }
        player.port.postMessage(float32, [float32.buffer]);
      });

      socket.addEventListener('close', () => {
        status.textContent = 'Desconectado.';
        connectButton.disabled = false;
      });

      socket.addEventListener('error', () => {
        status.textContent = 'No se pudo conectar con el servidor.';
        connectButton.disabled = false;
      });
    });
  </script>
</body>
</html>
