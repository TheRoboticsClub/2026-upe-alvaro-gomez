<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio por WebRTC</title>
</head>
<body>
  <h1>Audio por WebRTC</h1>
  <button id="connect-button">Conectar y recibir audio</button>
  <p id="status">Desconectado</p>
  <audio id="audio-player" autoplay controls></audio>

  <script>
    const connectButton = document.querySelector('#connect-button');
    const status = document.querySelector('#status');
    const audioPlayer = document.querySelector('#audio-player');

    connectButton.addEventListener('click', () => {
      connectButton.disabled = true;
      status.textContent = 'Conectando...';

      const pc = new RTCPeerConnection();
      pc.addTransceiver('audio', { direction: 'recvonly' });

      // Cuando llega la pista remota, se conecta al reproductor.
      pc.addEventListener('track', (event) => {
        audioPlayer.srcObject = event.streams[0];
        status.textContent = 'Recibiendo audio.';
      });

      // WebSocket relativo al host actual: mismo servidor que sirve la página.
      const socket = new WebSocket(`ws://${location.host}/ws`);

      socket.addEventListener('open', async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.send(JSON.stringify({ type: offer.type, sdp: offer.sdp }));
      });

      socket.addEventListener('message', async (event) => {
        const message = JSON.parse(event.data);
        if (message.error) {
          status.textContent = message.error;
          connectButton.disabled = false;
          return;
        }
        // Respuesta SDP del servidor: completa el intercambio y arranca WebRTC.
        await pc.setRemoteDescription(message);
      });

      socket.addEventListener('error', () => {
        status.textContent = 'No se pudo conectar con el servidor.';
        connectButton.disabled = false;
      });
    });
  </script>
</body>
</html>
